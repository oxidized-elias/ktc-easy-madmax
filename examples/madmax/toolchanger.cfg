# Opt-in override: include AFTER the Easy Install include file.
# Supports MadMax side/keyslot docks and per-tool Maxwell coupling probes.
[toolchanger]
t_command_restore_axis: XYZ
params_madmax_calibrated: False
params_park_x: None
params_detach_x: None
params_safe_toolhead_y: None
params_safe_shuttle_y: None
params_close_y: None
params_attach_y: None
params_fast_speed: 6000
params_path_speed: 600

before_change_gcode:
  # Validate BOTH tools before releasing the current one.
  {% if dropoff_tool %}
    _MADMAX_CHECK TOOL="{dropoff_tool}"
  {% endif %}
  {% if pickup_tool %}
    _MADMAX_CHECK TOOL="{pickup_tool}"
  {% endif %}
  {% if dropoff_tool %}
    {% set tn = "T" ~ tool.tool_number|string %}
    {% if printer["gcode_macro " ~ tn] is defined %}
      SET_GCODE_VARIABLE MACRO={tn} VARIABLE=color VALUE="''"
    {% endif %}
  {% endif %}

dropoff_gcode:
  _MADMAX_CHECK TOOL="{tool.name}"
  STOP_TOOL_PROBE_CRASH_DETECTION
  G90
  # Reach clearance Y BEFORE crossing X with a head attached.
  G0 Y{tool.params_safe_toolhead_y} F{tool.params_fast_speed}
  G0 X{tool.params_detach_x} F{tool.params_fast_speed}
  G0 Y{tool.params_attach_y} F{tool.params_fast_speed}
  G0 X{tool.params_park_x} F{tool.params_path_speed}
  G0 Y{tool.params_close_y} F{tool.params_path_speed}
  G0 Y{tool.params_safe_shuttle_y} F{tool.params_fast_speed}

pickup_gcode:
  _MADMAX_CHECK TOOL="{tool.name}"
  G90
  G0 Y{tool.params_safe_shuttle_y} F{tool.params_fast_speed}
  G0 X{tool.params_park_x} F{tool.params_fast_speed}
  G0 Y{tool.params_close_y} F{tool.params_fast_speed}
  {% if tool.extruder %}
    M109 T{tool.tool_number} S{printer[tool.extruder].target|int}
  {% endif %}
  G0 Y{tool.params_attach_y} F{tool.params_path_speed}
  G0 X{tool.params_detach_x} F{tool.params_path_speed}
  VERIFY_TOOL_DETECTED T={tool.tool_number}
  START_TOOL_PROBE_CRASH_DETECTION T={tool.tool_number}
  G0 Y{tool.params_safe_toolhead_y} F{tool.params_fast_speed}
  # Restore XY while still at the original print Z; docking never moves Z.
  {% if 'X' in restore_position %}
    G0 X{restore_position.X} F{tool.params_fast_speed}
  {% endif %}
  {% if 'Y' in restore_position %}
    G0 Y{restore_position.Y} F{tool.params_fast_speed}
  {% endif %}
  {% if 'Z' in restore_position %}
    G0 Z{restore_position.Z} F{tool.params_fast_speed}
  {% endif %}

[gcode_macro _MADMAX_CHECK]
gcode:
  {% set tool = printer[params.TOOL] %}
  {% if not tool.params_madmax_calibrated %}
    {action_raise_error("MadMax: calibrate all dock coordinates and set params_madmax_calibrated: True for " ~ params.TOOL)}
  {% endif %}
  {% if printer.tool_probe_endstop is not defined %}
    {action_raise_error("MadMax profile requires per-tool coupling probes and tool_probe_endstop")}
  {% endif %}
  {% for axis, names in [('x', ['park_x', 'detach_x']), ('y', ['safe_toolhead_y', 'safe_shuttle_y', 'close_y', 'attach_y'])] %}
    {% set limits = printer.configfile.config['stepper_' ~ axis] %}
    {% for name in names %}
      {% set value = tool['params_' ~ name] %}
      {% if value is not number or value < limits.position_min|default(0)|float or value > limits.position_max|float %}
        {action_raise_error("MadMax: missing or out-of-range params_" ~ name ~ " for " ~ params.TOOL)}
      {% endif %}
    {% endfor %}
  {% endfor %}
  {% if not (tool.params_attach_y < tool.params_close_y <= tool.params_safe_shuttle_y <= tool.params_safe_toolhead_y) %}
    {action_raise_error("MadMax: expected attach_y < close_y <= safe_shuttle_y <= safe_toolhead_y")}
  {% endif %}
  {% if tool.params_park_x == tool.params_detach_x or tool.params_path_speed <= 0 or tool.params_fast_speed <= 0 %}
    {action_raise_error("MadMax: park_x and detach_x must differ and speeds must be positive")}
  {% endif %}

# Easy Install's alignment helpers assume a Y/Z lift-out dock.
[gcode_macro TOOL_ALIGN_START]
gcode:
  {action_raise_error("MadMax: use manual XY dock calibration; see examples/madmax/README.md")}

[gcode_macro TOOL_ALIGN_TEST]
gcode:
  {action_raise_error("MadMax: use TEST_TOOL_DOCKING after XY calibration")}

[gcode_macro TOOL_ALIGN_DONE]
gcode:
  {action_raise_error("MadMax: save measured park_x and detach_x in your tool config")}
